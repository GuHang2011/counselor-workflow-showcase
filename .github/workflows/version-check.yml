name: Version and public contracts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version and release notes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=()
          if [ -n "$BASE_REF" ]; then args+=(--base-ref "$BASE_REF"); fi
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          python scripts/check_version.py "${args[@]}"
      - name: Version regression tests
        run: python -m unittest discover -s tests -p test_version.py -v
      - name: Static showcase contract tests
        run: node --test tests/contracts.test.mjs
