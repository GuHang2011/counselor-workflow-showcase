spring.application.name=counselor-erp
server.port=${ERP_PORT:9999}
spring.datasource.url=${ERP_DB_URL:jdbc:h2:file:./data/counselor-erp;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ERP_DB_USER:sa}
spring.datasource.password=${ERP_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
server.error.include-message=never
spring.jackson.time-zone=Asia/Shanghai
erp.admin-password=${ERP_ADMIN_PASSWORD:}
erp.upload-dir=${ERP_UPLOAD_DIR:./data/uploads}
erp.allowed-origins=${ERP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
erp.media.require-scan=${ERP_MEDIA_REQUIRE_SCAN:true}
erp.media.clam-host=${ERP_CLAM_HOST:}
erp.media.clam-port=${ERP_CLAM_PORT:3310}
erp.media.ffprobe=${ERP_FFPROBE:}
erp.media.ffmpeg=${ERP_FFMPEG:}
erp.data-key=${ERP_DATA_KEY:}
erp.backup-key=${ERP_BACKUP_KEY:}
erp.backup-dir=${ERP_BACKUP_DIR:./data/backups}
# AI assistant defaults to local, deterministic templates. A model is optional
# and is only contacted when ERP_AI_ALLOW_EXTERNAL_DATA=true. HTTPS endpoints
# are allowed; plain HTTP is restricted to loopback models. School approval is
# required before entering a provider URL. Saved API keys require ERP_DATA_KEY.
erp.ai.enabled=${ERP_AI_ENABLED:false}
erp.ai.provider=${ERP_AI_PROVIDER:local}
erp.ai.base-url=${ERP_AI_BASE_URL:}
erp.ai.api-key=${ERP_AI_API_KEY:}
erp.ai.model=${ERP_AI_MODEL:}
erp.ai.allow-external-data=${ERP_AI_ALLOW_EXTERNAL_DATA:false}
erp.ai.connect-timeout-ms=${ERP_AI_CONNECT_TIMEOUT_MS:1500}
erp.ai.read-timeout-ms=${ERP_AI_READ_TIMEOUT_MS:6000}
